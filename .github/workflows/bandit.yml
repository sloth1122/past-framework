name: "Bandit Security Scan"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bandit:
    name: Bandit Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: bandit -r scripts/ backtest/ -f json -o /tmp/bandit_results.json || true

      - name: Check for HIGH severity findings
        run: |
          python3 -c "
          import json
          with open('/tmp/bandit_results.json') as f:
              results = json.load(f).get('results', [])
          high = [r for r in results if r['issue_severity'] == 'HIGH']
          if high:
              for h in high:
                  print(f\"HIGH: {h['filename']}:{h['line_number']} {h['test_id']} {h['issue_text']}\")
              exit(1)
          print(f'Bandit: {len(results)} findings (0 HIGH)')
          "
